name: Build Tawseela Unsigned iOS IPA
# Re-run iOS build for latest Tawseela admin notification and push delivery updates

on:
  workflow_dispatch:
  push:
    branches:
      - build/tawseela-ios-ipa-v10
      - fix/saved-card-persistence-2026-11-14

permissions:
  contents: read

concurrency:
  group: tawseela-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://tawseela-ap-pzip-1--marwankomanda0.replit.app
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Use stable npm
        run: |
          npm install --global npm@10.9.4
          npm --version

      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify all workspace TypeScript
        run: npm run typecheck

      - name: Run workspace unit tests
        run: npm test

      - name: Upload npm diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-diagnostic-logs
          path: /Users/runner/.npm/_logs/*-debug-0.log
          if-no-files-found: warn
          retention-days: 3

      - name: Prepare Firebase configuration
        working-directory: mobile
        env:
          IOS_FIREBASE_PLIST_BASE64: ${{ secrets.IOS_FIREBASE_PLIST_BASE64 }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$IOS_FIREBASE_PLIST_BASE64" || {
            echo "Missing IOS_FIREBASE_PLIST_BASE64 secret"
            exit 1
          }

          test -n "$GOOGLE_WEB_CLIENT_ID" || {
            echo "Missing GOOGLE_WEB_CLIENT_ID secret"
            exit 1
          }

          printf '%s' "$IOS_FIREBASE_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          plutil -lint GoogleService-Info.plist

      - name: Generate iOS project
        working-directory: mobile
        env:
          GOOGLE_SERVICE_INFO_PLIST: ./GoogleService-Info.plist
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/expo-config.json", "utf8"));
            const firebase = c.extra?.firebase;
            const checks = {
              iosBundleIdentifier: c.ios?.bundleIdentifier === "com.tawseela.app",
              iosGoogleServicesFile: c.ios?.googleServicesFile === "./GoogleService-Info.plist" && fs.existsSync("GoogleService-Info.plist"),
              firebaseIosApiKey: !!firebase?.ios?.apiKey,
              firebaseIosAppId: !!firebase?.ios?.appId,
              googleWebClientId: !!c.extra?.googleWebClientId,
              googleNativePlugin: (c.plugins || []).some(p => (Array.isArray(p) ? p[0] : p) === "@react-native-google-signin/google-signin")
            };
            for (const [name, ok] of Object.entries(checks)) console.log(name + ": " + (ok ? "OK" : "MISSING"));
            if (Object.values(checks).some(ok => !ok)) process.exit(1);
          '
          npx expo prebuild --platform ios --no-install
          test -f ios/Tawseela/GoogleService-Info.plist || find ios -name GoogleService-Info.plist -print -quit | grep -q .
          cd ios
          pod install

      - name: Verify Xcode workspace
        working-directory: mobile
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo 'Liquid Glass requires the Xcode 27 SDK for this Expo SDK 58 build'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :UIDesignRequiresCompatibility' ios/Tawseela/Info.plist | grep -qx 'false' || { echo 'UIDesignRequiresCompatibility must be false'; exit 1; }
          xcodebuild -list -workspace ios/Tawseela.xcworkspace

      - name: Build unsigned iOS archive
        working-directory: mobile
        run: |
          xcodebuild \
            -workspace ios/Tawseela.xcworkspace \
            -scheme Tawseela \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tawseela.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R "$RUNNER_TEMP/Tawseela.xcarchive/Products/Applications/Tawseela.app" \
            "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/Tawseela-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawseela-unsigned-IPA
          path: Tawseela-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
