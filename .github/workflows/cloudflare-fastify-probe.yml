name: Cloudflare Fastify compatibility probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-probe:
    name: Build, deploy, and smoke-test isolated Fastify probe
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/saved-card-persistence-2026-11-14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install isolated Fastify probe dependency
        run: npm install --prefix cloudflare --no-package-lock --ignore-scripts

      - name: Deploy isolated Fastify probe
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler-fastify.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for deployment and diagnose GET /health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tawseela-fastify-workers-probe.mmmmaaaarrrrwwwwaaaannnn4.workers.dev"
          status="000"
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$URL/health" || true)"
            echo "Health attempt $attempt returned HTTP $status"
            if [ "$status" = "200" ]; then
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "Health response body:"
          cat /tmp/health.json || true
          echo
          test "$status" = "200"
          node -e "const x=require('/tmp/health.json'); if(x.ok!==true || x.productionApi!==false) process.exit(1); console.log(JSON.stringify(x))"

      - name: Smoke-test POST /echo
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tawseela-fastify-workers-probe.mmmmaaaarrrrwwwwaaaannnn4.workers.dev"
          status="$(curl --silent --show-error --output /tmp/echo.json --write-out '%{http_code}' -H 'content-type: application/json' -d '{"probe":"ok"}' "$URL/echo")"
          cat /tmp/echo.json
          test "$status" = "200"
          node -e "const x=require('/tmp/echo.json'); if(x.ok!==true || x.body?.probe!=='ok') process.exit(1); console.log(JSON.stringify(x))"

      - name: Smoke-test unknown route returns JSON 404
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tawseela-fastify-workers-probe.mmmmaaaarrrrwwwwaaaannnn4.workers.dev"
          status="$(curl --silent --output /tmp/not-found.json --write-out '%{http_code}' "$URL/__probe_missing_route__")"
          cat /tmp/not-found.json
          test "$status" = "404"
          node -e "const x=require('/tmp/not-found.json'); if(x.error?.code!=='not_found') process.exit(1); console.log(JSON.stringify(x))"
