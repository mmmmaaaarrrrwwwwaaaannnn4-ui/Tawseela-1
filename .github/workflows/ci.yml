name: Tawseela CI

on:
  push:
    branches:
      - fix/saved-card-persistence-2026-11-14
  pull_request:
    branches:
      - main

concurrency:
  group: tawseela-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
